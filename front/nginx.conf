server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers. These are set here rather than as a meta tag in index.html
  # so they apply to every response and do not constrain the Vite dev server,
  # which needs inline and eval for hot reload.
  #
  # style-src allows inline because Tailwind emits some inline style and because
  # the animation library writes to element style attributes directly. script-src
  # does not: the build emits external modules only, and keeping inline script
  # blocked is the half of this header that actually stops an injected payload.
  # The token lives in localStorage, so this is the main structural defence
  # against a future cross-site scripting bug being able to exfiltrate it.
  #
  # font-src is the application origin alone: the typefaces are bundled into
  # /assets/ at build time, so no third-party font host is named anywhere.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  # No Referer at all, same origin included. The password reset page is opened
  # with a credential in its address, and the default policy would hand that
  # full address to every same origin request the page makes, the API's
  # access log among them. Nothing here reads a Referer.
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  # Hashed build assets are immutable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Proxy the API so the browser talks to a single origin
  location /api/ {
    proxy_pass http://back:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrites rather than appends: this nginx is the edge, so any
    # X-Forwarded-For the client sent is a claim, not a hop, and the API keys
    # its rate limits on the address it ends up with.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://back:5000;
    proxy_set_header Host $host;
  }

  # Single page application fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
