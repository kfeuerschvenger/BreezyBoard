<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <!-- user-scalable=no used to be here, which stops a person pinching to
         zoom. That fails WCAG 1.4.4 and it is the one accessibility defect
         in this application that no component can fix, because it disables
         the browser's own remedy for every other one. -->
    <!-- interactive-widget=resizes-content makes the on-screen keyboard shrink
         the layout viewport, so dynamic viewport units, and the bottom sheet
         sized with them, end above the keyboard instead of behind it. Browsers
         that do not support it ignore it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <!-- Matches the Referrer-Policy header nginx sends in production, so the
         development server holds the same line: the password reset page is
         opened with a credential in its address. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f6f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1b2d" />
    <meta name="description" content="Kanban boards that move at the speed of wind." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="BreezyBoard" />
    <meta property="og:description" content="Kanban boards that move at the speed of wind." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="breezyboard: Organize at the speed of wind." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BreezyBoard" />
    <meta name="twitter:description" content="Kanban boards that move at the speed of wind." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="author" content="Kevin Feuerschvenger" />
    <meta name="keywords" content="Kanban, Project Management, Task Management, Boards, BreezyBoard" />
    <title>BreezyBoard</title>
