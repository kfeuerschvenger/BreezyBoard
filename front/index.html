<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <!-- user-scalable=no used to be here, which stops a person pinching to
         zoom. That fails WCAG 1.4.4 and it is the one accessibility defect
         in this application that no component can fix, because it disables
         the browser's own remedy for every other one. -->
    <!-- interactive-widget=resizes-content makes the on-screen keyboard shrink
         the layout viewport, so dynamic viewport units, and the bottom sheet
         sized with them, end above the keyboard instead of behind it. Browsers
         that do not support it ignore it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#333" />
    <meta name="og:description" property="og:description" content="BreezyBoard application" />
    <meta name="description" content="BreezyBoard application" />
    <meta name="robots" content="index, follow" />
    <meta name="og:title" property="og:title" content="BreezyBoard" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="author" content="Kevin Feuerschvenger" />
    <meta name="keywords" content="Kanban, Project Management, Task Management, Boards, BreezyBoard" />
    <title>Boards</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
