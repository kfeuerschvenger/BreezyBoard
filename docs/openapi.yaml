components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The token from POST /auth/login or POST /auth/register, or the latest X-Auth-Token response header.
  headers:
    XRequestId:
      description: The id of this request, the one sent in X-Request-Id or a generated UUID.
      schema:
        type: string
    XAuthToken:
      description: The renewed session token. Present on every response once the bearer token has been accepted, errors from the handler included. A client replaces the stored token with it.
      schema:
        type: string
  responses:
    BadRequest:
      description: "The request was refused before any work was done: a malformed id, a field that fails its schema (`errors` lists each as `{ field, message }`), or a rule the service enforces. Specific codes: VALIDATION_ERROR, INVALID_RESET_TOKEN, WRONG_CURRENT_PASSWORD, INVALID_FILE_TYPE, FILE_TOO_LARGE."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            message: Validation error
            code: VALIDATION_ERROR
            errors:
              - field: title
                message: Title is required
    Unauthorized:
      description: "No session. Codes: UNAUTHORIZED (no, malformed, expired or unknown token), TOKEN_REVOKED (the token predates a logout or a password change), SESSION_EXPIRED (the absolute limit passed). A client signs the person out on any of them."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            message: Authentication required
            code: UNAUTHORIZED
            errors: []
    Forbidden:
      description: The caller has a session but not the role the route needs.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            message: Not authorized to access this board
            code: FORBIDDEN
            errors: []
    NotFound:
      description: The resource does not exist, is soft deleted, or is one the route is documented to hide from a caller with no role on it.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            message: Board not found
            code: NOT_FOUND
            errors: []
    Conflict:
      description: The request disagrees with the current state of the data. The client should reload and try again.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            message: A neighbouring task is no longer where the client expected it. Reload the board and try again.
            code: CONFLICT
            errors: []
    TooManyRequests:
      description: The limiter for this route is spent. The body has no `errors`. The `RateLimit-*` response headers say when the budget returns.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            message: Too many attempts. Please wait before trying again.
            code: RATE_LIMITED
    InternalError:
      description: An unexpected failure. The body names nothing about it and has no `errors`; the request id points at the log line.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            success: false
            message: Internal Server Error
            code: INTERNAL
    ServiceUnavailable:
      description: The database is not reachable. The body names nothing about the deployment.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                const: unavailable
              message:
                const: Service unavailable
            required:
              - status
              - message
          example:
            status: unavailable
            message: Service unavailable
  schemas:
    RegisterRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          allOf:
            - pattern: (?=.*[a-z])
            - pattern: (?=.*[A-Z])
            - pattern: (?=.*\d)
      required:
        - firstName
        - lastName
        - email
        - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
      additionalProperties: false
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          minLength: 8
          allOf:
            - pattern: (?=.*[a-z])
            - pattern: (?=.*[A-Z])
            - pattern: (?=.*\d)
      required:
        - token
        - newPassword
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          allOf:
            - pattern: (?=.*[a-z])
            - pattern: (?=.*[A-Z])
            - pattern: (?=.*\d)
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
    CreateBoardRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        color:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        template:
          anyOf:
            - type: string
              pattern: ^[0-9a-fA-F]{24}$
            - type: "null"
        workspaceId:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        members:
          type: array
          items:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      required:
        - title
        - color
      additionalProperties: false
    UpdateBoardRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        color:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
    AddBoardMembersRequest:
      type: object
      properties:
        members:
          minItems: 1
          type: array
          items:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
