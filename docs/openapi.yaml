openapi: 3.1.0
info:
  title: BreezyBoard API
  version: 1.0.0
  description: |-
    The BreezyBoard API, the one service behind the web client. Every path below is relative to `/api/v1`. The same routers are also mounted at `/api`, a deprecated alias that answers identically and logs a warning the first time it is used.

    Every success is `{ "success": true, "data": ... }`, with a `pagination` object beside `data` on paginated lists. Every failure is `{ "success": false, "message": "...", "code": "...", "errors": [...] }` with a machine readable `code`. Pagination is opt in: without `limit` a list returns everything, and `pagination.total` is always present.

    Authentication is a bearer JWT in the `Authorization` header, obtained from `POST /auth/login` or `POST /auth/register`. There is no cookie. The session slides: every authenticated request is answered with a fresh token in the `X-Auth-Token` response header, and the client sends that one next. The token dies after JWT_INACTIVITY_TTL_MS without a request (15 minutes by default) and after JWT_ABSOLUTE_TTL_MS from sign in whatever happens (4 hours by default); logout and a password change revoke every earlier token at once.

    Every response carries an `X-Request-Id`. Send your own in the request to have it echoed back, which ties a client log line to a server log line.

    Ids are 24 character hexadecimal strings. A malformed id in a path answers 400 before the route reaches the database.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: The current version of the API.
tags:
  - name: Auth
    description: Accounts, the session and password recovery.
  - name: Boards
    description: Boards, their members, and the soft delete with restore.
  - name: Tasks
    description: Tasks, their checklists, ordering, and the soft delete with restore.
  - name: Reference data
    description: The colour palette and the board templates.
  - name: Dashboard
    description: Totals for the home page.
  - name: Users
    description: People, profiles and pictures.
  - name: Workspaces
    description: Workspaces and their members.
  - name: Operations
    description: Liveness for the container healthcheck and for monitors.
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Create an account
      description: Creates the account and its personal workspace and signs the person in. Answers 400 when the email is already registered. Limited per client address, 20 an hour unless REGISTRATION_LIMIT_PER_HOUR says otherwise.
      operationId: postAuthRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account, and its first session token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      tags:
        - Auth
      summary: Sign in
      description: A wrong password and an unknown email address answer the same 401, so the route cannot be used to find out which addresses have an account. Failures alone count towards the limit of 10 per 15 minutes per client address.
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The person, and a session token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Ask for a password reset link
      description: Always answers 202 with the same body, whether or not the address has an account, and mails a link only when it does. Every request counts towards the limit of 10 per 15 minutes per client address, successful ones included.
      operationId: postAuthForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: The request was accepted. Nothing says whether an email was sent.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Set a new password with a mailed token
      description: Consumes the token and revokes every session of the account. An unknown, expired or already used token answers one error, 400 with the code INVALID_RESET_TOKEN. Shares the recovery limit with the request for a link.
      operationId: postAuthResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: The password was changed and every session was revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/validate-token:
    get:
      tags:
        - Auth
      summary: Check that the token is still good
      description: Kept for clients that still call it on session restore. Prefer GET /auth/me.
      operationId: getAuthValidateToken
      deprecated: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The token is valid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: End the session now
      description: Revokes every token issued to the account before this call, so the one just used fails on its next use.
      operationId: postAuthLogout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The session ended.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggedOutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/ping:
    get:
      tags:
        - Auth
      summary: Renew the session with no other effect
      description: The renewal happens in the authentication step, before the handler runs, and the new token is in the X-Auth-Token response header. Answers 204 with Cache-Control no-store.
      operationId: getAuthPing
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The session was renewed. There is no body.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      tags:
        - Auth
      summary: The signed in person
      operationId: getAuthMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account the token belongs to.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/change-password:
    post:
      tags:
        - Auth
      summary: Change the password
      description: A wrong current password is a 400 with the code WRONG_CURRENT_PASSWORD, never a 401, because a client treats every 401 as an ended session. Success revokes every token issued before it. Failures count towards a limit of 10 per 15 minutes per account.
      operationId: postAuthChangePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: The password changed. Sign in again with the new one.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /boards:
    get:
      tags:
        - Boards
      summary: List the boards the caller can open
      description: Boards in the workspaces the caller belongs to that the caller created or is a member of, newest activity first. Soft deleted boards are not listed. Each item carries taskCount, memberCount, progress and viewerRole.
      operationId: getBoards
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            exclusiveMinimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: A page of boards, or all of them when limit is absent.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Boards
      summary: Create a board
      description: The columns are copied from the template onto the board. Without workspaceId the board goes into the caller's personal workspace.
      operationId: postBoards
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoardRequest"
      responses:
        "201":
          description: The new board.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /boards/{id}:
    get:
      tags:
        - Boards
      summary: Read a board
      description: "Access: Board member."
      operationId: getBoardsById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      responses:
        "200":
          description: The board, with viewerRole set to the role of the caller.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Boards
      summary: Update a board
      description: "Only title, description and color are applied. Other fields are ignored. Access: Board owner."
      operationId: putBoardsById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoardRequest"
      responses:
        "200":
          description: The updated board.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Boards
      summary: Delete a board
      description: "A soft delete: the board and its tasks disappear from every read and can be brought back with the restore route until BOARD_RETENTION_MS has passed, after which a background job removes them for good. Access: Board owner."
      operationId: deleteBoardsById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      responses:
        "200":
          description: The board was marked deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDeletedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /boards/{id}/restore:
    post:
      tags:
        - Boards
      summary: Restore a deleted board
      description: "Somebody with no role on the board gets the 404 an unknown id gets. A member who is not an owner gets a 403. Access: Board owner."
      operationId: postBoardsByIdRestore
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      responses:
        "200":
          description: The board, back as it was.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /boards/{id}/members:
    patch:
      tags:
        - Boards
      summary: Add members to a board
      description: "Every id has to be an existing user, otherwise the answer is a 400. Somebody who is not yet in the workspace of the board is added to it as a member, since a board membership gives no access to anyone outside the workspace. Access: Board owner."
      operationId: patchBoardsByIdMembers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBoardMembersRequest"
      responses:
        "200":
          description: The board with its members populated.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/board/{boardId}:
    get:
      tags:
        - Tasks
      summary: List the tasks of a board
      description: "Live tasks only, ascending by order key. Soft deleted tasks are not listed. Access: Board member."
      operationId: getTasksBoardByBoardId
      security:
        - bearerAuth: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            exclusiveMinimum: 0
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: A page of tasks, or all of them when limit is absent.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Tasks
      summary: Create a task
      description: "The task goes to the bottom of the column named by status. The order key is minted by the server. The status has to be the id of a column of this board, and the owner a member of it. Access: Board member."
      operationId: postTasksBoardByBoardId
      security:
        - bearerAuth: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: The new task.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Read a task
      description: "Access: Member of the task's board."
      operationId: getTasksById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      responses:
        "200":
          description: The task.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Tasks
      summary: Update a task
      description: "The board and the order key cannot be changed here: a task changes column and position through the move route. Unknown fields are ignored. Access: Member of the task's board."
      operationId: putTasksById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: The updated task.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Tasks
      summary: Delete a task
      description: "A soft delete. The task keeps its id, dates, column and order key, and the restore route puts it back in the same place until BOARD_RETENTION_MS has passed. Access: Member of the task's board."
      operationId: deleteTasksById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      responses:
        "200":
          description: The task was marked deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDeletedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/restore:
    post:
      tags:
        - Tasks
      summary: Restore a deleted task
      description: "Idempotent: restoring a task that is not deleted answers with the task. Somebody with no role on the board gets 404 whether the task exists or not. A task deleted longer ago than the retention window is a 404. Access: Member of the task's board."
      operationId: postTasksByIdRestore
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
      responses:
        "200":
          description: The task, back in its column.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Auth-Token:
              $ref: "#/components/headers/XAuthToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/move:
    patch:
      tags:
        - Tasks
