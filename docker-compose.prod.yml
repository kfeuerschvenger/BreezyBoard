name: breezyboard-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-boards-db}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  back:
    build:
      context: ./back
      target: prod
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-boards-db}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      NODE_ENV: production
      SALT: 12
      # Comma separated list of origins allowed to call the API from a browser.
      # nginx proxies /api on the same origin as the site, so for this topology
      # the value is simply the public origin of the site itself, for example
      # https://breezyboard.example. The API refuses to start without it rather
      # than falling back to allowing every origin, which is what it used to do.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the public origin of the site}
    volumes:
      - uploads:/app/uploads

  front:
    build:
      context: ./front
      target: prod
      args:
        VITE_API_URL: /api/v1
        VITE_USE_STRICT_MODE: "true"
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  mongo-data:
  uploads:
