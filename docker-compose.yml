name: breezyboard

services:
  mongo:
    image: mongo:7
    container_name: breezyboard-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-boards-db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  back:
    build:
      context: ./back
      target: dev
    container_name: breezyboard-back
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB:-boards-db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      NODE_ENV: development
      SALT: 10
      DOTENV_CONFIG_QUIET: "true"
    ports:
      - "${BACK_PORT:-5000}:5000"
    volumes:
      - ./back/src:/app/src
      - ./back/seeds:/app/seeds
      - back-node-modules:/app/node_modules
      - uploads:/app/uploads

  front:
    build:
      context: ./front
      target: dev
    container_name: breezyboard-front
    restart: unless-stopped
    depends_on:
      - back
    environment:
      VITE_API_URL: http://localhost:${BACK_PORT:-5000}/api
      VITE_USE_STRICT_MODE: "false"
    ports:
      - "${FRONT_PORT:-5173}:5173"
    volumes:
      - ./front/src:/app/src
      - ./front/public:/app/public
      - ./front/index.html:/app/index.html
      - ./front/vite.config.ts:/app/vite.config.ts
      - front-node-modules:/app/node_modules

volumes:
  mongo-data:
  uploads:
  back-node-modules:
  front-node-modules:
