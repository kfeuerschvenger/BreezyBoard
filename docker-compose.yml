name: breezyboard

services:
  mongo:
    image: mongo:7
    container_name: breezyboard-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-boards-db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  back:
    build:
      context: ./back
      target: dev
    container_name: breezyboard-back
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB:-boards-db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      NODE_ENV: development
      SALT: 10
      # The sliding session's two independent clocks: the inactivity window
      # (rewritten on every renewal) and the absolute cap anchored on
      # sessionStartedAt (never rewritten). Both are validated with a
      # fallback in back/src/config/env.js, so these are the operational
      # defaults, not a required setting.
      JWT_INACTIVITY_TTL_MS: ${JWT_INACTIVITY_TTL_MS:-900000}
      JWT_ABSOLUTE_TTL_MS: ${JWT_ABSOLUTE_TTL_MS:-14400000}
      DOTENV_CONFIG_QUIET: "true"
    ports:
      - "${BACK_PORT:-5000}:5000"
    volumes:
      # Source only. node_modules deliberately stays inside the image: the bind
      # mounts above do not cover it, so a named volume there would only shadow
      # the image's tree with a stale copy and make every dependency change
      # require deleting a volume by hand.
      - ./back/src:/app/src
      - ./back/seeds:/app/seeds
      - uploads:/app/uploads

  front:
    build:
      context: ./front
      target: dev
    container_name: breezyboard-front
    restart: unless-stopped
    depends_on:
      - back
    environment:
      VITE_API_URL: http://localhost:${BACK_PORT:-5000}/api/v1
      VITE_USE_STRICT_MODE: "false"
    ports:
      - "${FRONT_PORT:-5173}:5173"
    volumes:
      - ./front/src:/app/src
      - ./front/public:/app/public
      - ./front/index.html:/app/index.html
      - ./front/vite.config.ts:/app/vite.config.ts

volumes:
  mongo-data:
  uploads:
